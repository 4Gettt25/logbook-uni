# Javalin Logbook Configuration
# Port configuration
PORT=8080

# Database configuration (default H2)
# For PostgreSQL, set SPRING_PROFILES_ACTIVE=postgres in .env file
DB_HOST=localhost
DB_PORT=5432
DB_NAME=logbook
DB_USER=postgres
DB_PASSWORD=

# File upload limits (in bytes)
MAX_FILE_SIZE=52428800
MAX_REQUEST_SIZE=209715200
